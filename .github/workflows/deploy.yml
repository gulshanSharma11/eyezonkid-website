# Auto-deploy: every push to "main" tells cPanel to pull the latest code
# from GitHub and deploy it (using .cpanel.yml) to public_html/eyezonkid.com.
#
# Needs 3 repository secrets (GitHub → Settings → Secrets and variables → Actions):
#   CPANEL_HOST   your cPanel server name, e.g. p3plzcpnl123456.prod.phx3.secureserver.net
#   CPANEL_USER   callastro1
#   CPANEL_TOKEN  the API token from cPanel → Manage API Tokens
name: Deploy eyezonkid.com

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REPO_ROOT: /home/${{ secrets.CPANEL_USER }}/repositories/eyezonkid-website

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 1. cPanel pulls the latest code from GitHub
        run: |
          curl -sS -H "Authorization: cpanel ${{ secrets.CPANEL_USER }}:${{ secrets.CPANEL_TOKEN }}" \
            "https://${{ secrets.CPANEL_HOST }}:2083/execute/VersionControl/update?repository_root=${REPO_ROOT}&branch=main" | tee pull.json
          grep -q '"status":1' pull.json || { echo "Pull failed"; exit 1; }

      - name: 2. cPanel deploys it to public_html/eyezonkid.com
        run: |
          curl -sS -H "Authorization: cpanel ${{ secrets.CPANEL_USER }}:${{ secrets.CPANEL_TOKEN }}" \
            "https://${{ secrets.CPANEL_HOST }}:2083/execute/VersionControlDeployment/create?repository_root=${REPO_ROOT}" | tee deploy.json
          grep -q '"status":1' deploy.json || { echo "Deploy failed"; exit 1; }
